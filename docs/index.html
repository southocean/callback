<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nam Nguyen — Senior SWE, Web Development, Google Meet</title>
<meta name="description" content="An interactive CV for Nam Nguyen, lead front-end developer in Uppsala, applying to the Google Meet web-client team in Stockholm. Built as a faithful clone of Meet itself: TypeScript, no framework, no dependencies, tests you can run in the browser.">

<!-- Reviews S1/S2: no third-party requests at all, and a policy that says so. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">

<!-- Review R6: the link gets pasted into a chat; the card is what people see. -->
<meta property="og:type" content="profile">
<meta property="og:title" content="Nam Nguyen — Callback">
<meta property="og:description" content="A CV that opens as a video call. Seven years leading a real-time multiplayer client, applying to Google Meet web in Stockholm.">

<!-- Critical CSS, inlined. Review U9: the first screen paints immediately, and
     it paints with JavaScript disabled. The values are Meet's own, measured. -->
<style>
  :root{color-scheme:only light;--w:#fff;--ink:#1f1f1f;--sec:#444746;--outline:#c4c7c5;--blue:#0b57d0;--surface:#f0f4f9;
        --nav-pill:#c2e7ff;--nav-icon:#001d35;--nav-label:#00639b;--newbtn:#c4eed0;--newbtn-ink:#0b2818;--sched:#d3e3fd;
        --font:"Google Sans Flex","Google Sans Text","Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  #app{min-height:100dvh;display:flex;flex-direction:column}
  #app>*{flex:1 1 auto;min-height:0}
  body{background:#fff;color:var(--ink);font:400 14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
  .skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--blue);color:#fff;padding:10px 18px;border-radius:0 0 8px 0;font-weight:500;text-decoration:none}
  .skip:focus{left:0}
  .home{min-height:100%;display:flex;flex-direction:column}
  .home-bar{height:56px;display:flex;align-items:center;padding:0 16px;gap:12px}
  .lockup{display:flex;align-items:center;gap:6px}
  .lockup-word{font:400 22px/1 var(--font);color:#5f6368;letter-spacing:-.2px}
  .home-composer{margin:0 auto;display:flex;align-items:center;gap:12px}
  .composer-pill{display:flex;align-items:center;height:48px;border-radius:28px;background:var(--surface);padding:0 6px 0 16px;min-width:340px}
  .composer-pill input{border:0;background:transparent;outline:none;flex:1 1 auto;font:400 16px/1 var(--font);color:var(--ink);padding:0 12px;min-width:0}
  .composer-join{height:36px;border-radius:18px;border:0;background:transparent;padding:0 18px;font:500 14px/1 var(--font);color:rgba(31,31,31,.38)}
  .m-btn{height:40px;border-radius:20px;padding:0 24px;border:0;cursor:pointer;font:500 14px/1 var(--font);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .m-tonal{background:var(--newbtn);color:var(--newbtn-ink)}
  .m-filled{background:var(--blue);color:#fff}
  .m-outlined{background:transparent;color:var(--blue);border:1px solid #747775}
  .home-bar-right{display:flex;align-items:center;gap:4px;margin-left:auto}
  .icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--sec);display:grid;place-items:center;cursor:pointer}
  .avatar-btn{width:32px;height:32px;border-radius:50%;border:0;padding:0;background:linear-gradient(145deg,#8ab4f8,#34a853);color:#10221a;font:500 13px/1 var(--font);display:grid;place-items:center;margin-left:8px}
  .home-body{flex:1 1 auto;display:flex}
  .rail{flex:0 0 104px;padding-top:48px}
  .rail-item{width:104px;height:56px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
  .rail-pill{width:56px;height:32px;border-radius:9999px;display:grid;place-items:center;color:var(--sec)}
  .rail-item[aria-current="true"] .rail-pill{background:var(--nav-pill);color:var(--nav-icon)}
  .rail-label{font:500 12px/16px var(--font);letter-spacing:.1px;color:var(--sec)}
  .rail-item[aria-current="true"] .rail-label{color:var(--nav-label)}
  .home-main{flex:1 1 auto;padding:32px 40px 60px;max-width:1180px}
  .date-row{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .date-title{font:400 22px/1.2 var(--font);margin:0}
  .banner{display:flex;align-items:center;gap:16px;border:1px solid var(--outline);border-radius:12px;padding:16px 20px;margin-bottom:32px}
  .banner-t{font:500 14px/20px var(--font)}
  .banner-s{font:400 13px/18px var(--font);color:var(--sec)}
  .banner a{margin-left:auto;color:var(--blue);font:500 14px/1 var(--font);text-decoration:none}
  .sched-label{font:400 13px/20px var(--font);color:var(--sec);margin-bottom:10px}
  .sched-card{background:var(--sched);border-radius:16px;padding:22px 26px;display:flex;align-items:center;gap:20px;border:0;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
  .sched-when{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .now-chip{border:1px solid var(--blue);color:var(--blue);border-radius:10px;font:500 12px/1 var(--font);padding:4px 9px}
  .sched-time{font:500 13px/1 var(--font);color:var(--blue)}
  .sched-title{font:400 20px/28px var(--font)}
  .sched-join{margin-left:auto;background:var(--blue);color:#fff;border:0;border-radius:24px;height:48px;padding:0 32px;font:500 15px/1 var(--font);flex:0 0 auto;display:grid;place-items:center}
  .sched-note{font:400 12px/18px var(--font);color:var(--sec);margin-top:14px}
  .home-alt{margin-top:34px;display:flex;gap:10px;flex-wrap:wrap}
  @media(max-width:720px){
    .home-bar{flex-wrap:wrap;height:auto;padding:10px 12px}
    .home-composer{order:3;width:100%;margin:0}
    .composer-pill{min-width:0;width:100%}
    .home-body{display:block}
    .home-main{padding:20px 16px 100px;max-width:none}
    .sched-card{flex-direction:column;align-items:flex-start}
    .sched-join{margin:0;width:100%}
    .rail{display:flex;justify-content:center;gap:24px;padding:0;border-top:1px solid var(--outline)}
  }
</style>
</head>
