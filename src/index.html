<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meet Nam Nguyen — Senior SWE, Web Development, Google Meet</title>
<meta name="description" content="An interactive CV for Nam Nguyen, lead front-end developer in Uppsala, applying to the Google Meet web-client team in Stockholm. Built as a measured rebuild of Meet itself: TypeScript, no framework, no dependencies, tests you can run in the browser.">
<meta name="author" content="Nam Nguyen">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="only light">

<!-- The only third-party origins on this page are Google's own font CDN, and
     the policy allows exactly those two and nothing else. Google Sans, Google
     Sans Text and Product Sans are not open source and cannot be redistributed,
     so they are linked from the API rather than copied. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">

<meta property="og:type" content="profile">
<meta property="og:title" content="Meet Nam Nguyen">
<meta property="og:description" content="A CV that opens as a video call, rebuilt from a measured spec of Google Meet. Seven years leading a real-time multiplayer client.">
<meta property="og:image" content="share-card.svg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/symbols-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500&family=Product+Sans&display=swap">
<link rel="stylesheet" href="styles.css">

<!-- Critical CSS, inlined: the first screen paints before the bundle arrives,
     and it paints with JavaScript disabled. Values are Meet's own, measured. -->
<style>
  @font-face{font-family:'Material Symbols Outlined';src:url('fonts/symbols-subset.woff2') format('woff2-variations');font-weight:100 700;font-display:block}
  :root{color-scheme:only light;--w:#fff;--ink:#1f1f1f;--sec:#444746;--outline:#c4c7c5;--blue:#0b57d0;
        --composer:#e9eef6;--composer-h:#dde3ea;--nav-pill:#c2e7ff;--nav-icon:#001d35;--nav-label:#00639b;--newbtn:#c4eed0;
        --newbtn-ink:#072711;--sched:#d3e3fd;--disabled-bg:rgba(31,31,31,.12);--disabled-fg:rgba(16,16,16,.3);
        --font:"Google Sans Text","Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--font-title:"Google Sans","Google Sans Text",Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--font-brand:"Product Sans","Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  #app{min-height:100dvh;display:flex;flex-direction:column}
  #app>*{flex:1 1 auto;min-height:0}
  body{background:#fff;color:var(--ink);font:400 14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
  .ms{font-family:'Material Symbols Outlined';font-weight:normal;line-height:1;display:inline-block;
      white-space:nowrap;direction:ltr;font-feature-settings:'liga';flex:0 0 auto;user-select:none;
      -webkit-font-smoothing:antialiased}
  .skip{position:absolute;left:-9999px;top:0;z-index:200;background-color:var(--blue);color:#fff;padding:10px 18px;border-radius:0 0 8px 0;font-weight:500;text-decoration:none}
  .skip:focus{left:0}
  .home{min-height:100%;display:flex;flex-direction:column}
  .home-bar{height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;gap:12px;position:relative}
  .lockup{display:flex;align-items:center;gap:5px;flex:0 0 auto;grid-column:1;justify-self:start;padding-left:4px}
  .lk-words{display:flex;align-items:baseline;font:400 22px/44px var(--font-brand);white-space:nowrap}
  .lk-google{color:#1f1f1f}
  .lk-meet,.lk-nam{color:#1f1f1f;margin-left:.26em}
  .home-composer{display:flex;align-items:center;gap:8px;position:absolute;left:50%;transform:translateX(-50%)}
  .composer-pill{display:flex;align-items:center;height:48px;border-radius:999px;background-color:var(--composer);padding:0 4px 0 16px;gap:16px;width:384px;max-width:384px}
  .composer-pill .ms{color:var(--sec)}
  .composer-pill input{border:0;background:transparent;outline:none;flex:1 1 auto;font:400 16px/24px var(--font-title);color:var(--ink);padding:0 6px;min-width:0}
  .composer-join{height:40px;margin:4px 0;border-radius:20px;border:0;padding:0 16px;font:500 14px/1 var(--font);background-color:var(--disabled-bg);color:var(--disabled-fg)}
  .m-btn{height:40px;border-radius:20px;padding:0 24px;border:0;cursor:pointer;font:500 14px/1 var(--font);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .m-tonal{background-color:var(--newbtn);color:var(--newbtn-ink)}
  .m-new{height:48px;border-radius:24px;padding:0 16px;gap:8px}
  .m-outlined{background:transparent;color:var(--blue);border:1px solid #747775}
  .home-bar-right{grid-column:3;display:flex;align-items:center;gap:4px;justify-self:end}
  .home-bar-right .icon-btn:nth-child(3){border-radius:50%}
  .icon-btn{width:40px;height:40px;border-radius:20px;border:0;background:transparent;color:var(--sec);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .avatar-btn{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;padding:4px;background:transparent;display:grid;place-items:center;flex:0 0 auto}
  .avatar-btn>span{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#8ab4f8,#34a853);color:#10221a;font:500 13px/1 var(--font);display:grid;place-items:center}
  .home-body{flex:1 1 auto;display:flex}
  .rail{flex:0 0 104px;padding-top:48px}
  .rail-item{width:104px;height:56px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;margin-bottom:14px}
  .rail-pill{width:56px;height:32px;border-radius:9999px;display:grid;place-items:center;color:var(--sec)}
  .rail-item[aria-current="true"] .rail-pill{background-color:var(--nav-pill);color:var(--nav-icon)}
  .rail-label{font:500 12px/16px var(--font);letter-spacing:.1px;color:var(--sec)}
  .rail-item[aria-current="true"] .rail-label{color:var(--nav-label)}
  .home-main{flex:1 1 auto;display:flex;justify-content:center;padding:22px 24px 60px;min-width:0}
  .home-col{width:100%;max-width:1052px;min-width:0}
  .date-row{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding:0 16px}
  .date-title{font:400 22px/28px var(--font-title);margin:0}
  .week{margin-left:auto;display:flex;align-items:center;gap:10px}
  .week .icon-btn{width:48px;height:56px;border-radius:28px}
  .day{width:48px;height:56px;text-align:center;border:0;background:transparent;padding:8px 0 0;border-radius:28px;display:flex;flex-direction:column;align-items:center;gap:0}
  .day-name{display:block;font:500 11px/16px var(--font-title);letter-spacing:.1px;color:var(--sec);text-transform:uppercase}
  .day-num{display:block;font:500 16px/24px var(--font-title);color:var(--sec)}
  .day[aria-current="true"]{background-color:var(--nav-pill)}
  .day[aria-current="true"] .day-name,.day[aria-current="true"] .day-num{color:var(--nav-icon)}
  .banner{display:flex;align-items:center;gap:11px;border:1px solid var(--outline);border-radius:28px;padding:16px 24px;margin:0 16px 32px;width:calc(100% - 32px);box-sizing:border-box}
  .banner-t{font:500 16px/24px var(--font-title)}
  .banner-s{font:400 14px/20px var(--font);color:var(--sec)}
  .banner a{margin-left:auto;color:var(--blue);font:500 14px/1 var(--font);text-decoration:none}
  .sched-label{font:500 14px/20px var(--font-title);color:var(--sec);padding:6px 0 6px 16px;margin:0 16px}
  .sched-card{background-color:var(--sched);border-radius:28px;padding:25px 40px;display:flex;align-items:center;gap:20px;border:0;width:calc(100% - 32px);margin:0 16px;text-align:left;cursor:pointer;font:inherit;color:inherit}
  .sched-when{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .now-chip{border:1px solid var(--blue);color:var(--blue);border-radius:10px;font:500 12px/1 var(--font);padding:4px 9px}
  .sched-time{font:700 14px/20px var(--font-title);color:var(--blue)}
  .sched-title{font:400 24px/32px var(--font-title);color:var(--ink)}
  .sched-join{margin-left:auto;background-color:var(--blue);color:#fff;border:0;border-radius:24px;height:48px;padding:0 32px;font:500 15px/1 var(--font);flex:0 0 auto;display:grid;place-items:center}
  .sched-note{font:400 12px/18px var(--font);color:var(--sec);margin:14px 32px 0}
  .home-alt{margin-top:34px;display:flex;gap:10px;flex-wrap:wrap}
  @media(max-width:720px){
    .home-bar{flex-wrap:wrap;height:auto;padding:10px 12px}
    .home-composer{order:3;width:100%;margin:0}
    .composer-pill{min-width:0;width:100%}
    .home-body{display:block}
    .home-main{padding:20px 16px 100px}
    .sched-card{flex-direction:column;align-items:flex-start}
    .sched-join{margin:0;width:100%}
    .rail{display:flex;justify-content:center;gap:24px;padding:0;border-top:1px solid var(--outline)}
    .rail-item{margin:0}
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div id="app">
  <!-- The home screen as static markup: first paint does not wait for the
       bundle, and this works with scripting switched off. The scripted version
       replaces it as soon as it loads, adding the live date and the wordmark
       animation. -->
  <div class="home" id="static-home">
    <header class="home-bar">
      <div class="lockup" role="img" aria-label="Meet Nam Nguyen">
        <svg viewBox="0 0 37 32" width="37" height="32" aria-hidden="true" class="lk-mark">
          <defs><linearGradient id="lkg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFDA45"/><stop offset=".55" stop-color="#FFD11B"/><stop offset="1" stop-color="#FBC900"/>
          </linearGradient></defs>
          <path d="M27 11.9 L35.3 8.4 V26.2 L27 22.7 Z" fill="#F9AA01" stroke="#F9AA01" stroke-width="1.6" stroke-linejoin="round"/>
          <rect x="1.25" y="3" width="25.75" height="27.6" rx="4.2" fill="url(#lkg)"/>
          <circle cx="7.2" cy="24.6" r="2.8" fill="#fff"/>
        </svg>
        <div class="lk-words">
          <span class="lk-google" aria-hidden="true">Google</span><span class="lk-meet" aria-hidden="true">Meet</span>
        </div>
      </div>

      <div class="home-composer">
        <div class="composer-pill">
          <span class="ms" style="font-size:24px" aria-hidden="true">keyboard</span>
          <input type="text" placeholder="Enter a code or link" aria-label="Enter a meeting code or link" autocomplete="off">
          <button class="composer-join" type="button" aria-disabled="true" data-go="lobby">Join</button>
        </div>
        <button class="m-btn m-tonal m-new" type="button" aria-label="New meeting" data-go="lobby">
          <span class="ms" style="font-size:20px" aria-hidden="true">video_call</span>
          New
        </button>
      </div>

      <div class="home-bar-right">
        <button class="icon-btn" type="button" aria-label="Support"><span class="ms" style="font-size:24px" aria-hidden="true">help</span></button>
        <button class="icon-btn" type="button" aria-label="Settings"><span class="ms" style="font-size:24px" aria-hidden="true">settings</span></button>
        <button class="icon-btn" type="button" aria-label="Google apps"><span class="ms" style="font-size:24px" aria-hidden="true">apps</span></button>
        <button class="avatar-btn" type="button" aria-label="Google Account: you"><span>G</span></button>
      </div>
    </header>

    <div class="home-body">
      <nav class="rail" aria-label="Sections">
        <button class="rail-item" type="button" aria-current="true">
          <span class="rail-pill"><span class="ms" style="font-size:24px;font-variation-settings:'FILL' 1" aria-hidden="true">event</span></span>
          <span class="rail-label">Meetings</span>
        </button>
        <button class="rail-item" type="button" aria-current="false" data-go="plain">
          <span class="rail-pill"><span class="ms" style="font-size:24px" aria-hidden="true">description</span></span>
          <span class="rail-label">CV</span>
        </button>
      </nav>

      <main class="home-main" id="main">
        <div class="home-col">
          <div class="date-row">
            <h1 class="date-title">Today</h1>
            <span class="ms" style="font-size:20px;color:var(--sec)" aria-hidden="true">calendar_month</span>
          </div>

          <div class="banner">
            <div>
              <div class="banner-t">Short of time? Read this as a plain document instead</div>
              <div class="banner-s">Same content, one page, prints cleanly. No call required.</div>
            </div>
            <a href="#plain" data-go="plain">Open document</a>
          </div>

          <div class="sched-label">Scheduled</div>
          <button class="sched-card" type="button" data-go="lobby">
            <div>
              <div class="sched-when"><span class="now-chip">Now</span><span class="sched-time">Starting now</span></div>
              <div class="sched-title">Nam&rsquo;s interview</div>
            </div>
            <span class="sched-join">Join</span>
          </button>
          <p class="sched-note">One participant. He has been waiting since March, when the CV was last updated.</p>

          <div class="home-alt">
            <a class="m-btn m-outlined" href="NamNguyen_CV_2026.pdf" download>Download the PDF</a>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
<script type="application/json" id="build-meta">
{"jsGzip":%JS_GZIP%,"jsRaw":%JS_RAW%,"cssGzip":%CSS_GZIP%,"budget":%BUDGET%,"deps":%DEPS%,"commit":"%COMMIT%"}
</script>
</body>
</html>
